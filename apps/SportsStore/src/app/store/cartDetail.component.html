<div class="container-fluid">
  <div class="row">
    <div class="col bg-dark text-white">
      <a class="navbar-brand">Sports Store</a>
    </div>
  </div>
  <div class="row">
    <div class="col mt-2">
      <h2 class="text-center">Your Cart</h2>
      <table class="table table-bordered table-striped p-2">
        <thead>
          <tr>
            <th>Quantity</th>
            <th>Product</th>
            <th class="text-right">Price</th>
            <th class="text-right">Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="cart.lines.length == 0">
            <td colspan="4" class="text-right">Your cart is empty</td>
          </tr>
          <tr *ngFor="let item of cart.lines">
            <td>
              <input
                type="number"
                class="form-control-sm"
                style="width: 5em"
                [value]="item.quantity"
                (change)="updateQuantityFromEvent(item.product, $event)"
              />
            </td>
            <td>{{ item.product.name }}</td>
            <td class="text-right">
              {{ item.product.price | currency: 'USD' : 'symbol' : '2.2-2' }}
            </td>
            <td class="text-right">{{ item.lineTotal | currency: 'USD' : 'symbol' : '2.2-2' }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-danger" (click)="cart.removeLine(item.product.id!)">
                Remove
              </button>
            </td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3" class="text-right">Total</td>
            <td class="text-right">{{ cart.cartPrice | currency: 'USD' : 'symbol' : '2.2-2' }}</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="text-center">
        <button class="btn btn-primary m-1" routerLink="/store">Continue Shopping</button>
        <button
          class="btn btn-secondary m-1"
          routerLink="/checkout"
          [disabled]="cart.lines.length == 0"
        >
          Checkout
        </button>
      </div>
    </div>
  </div>
</div>
