<div class="container-fluid">
  <div class="row">
    <div class="col bg-dark text-white">
      <a href="" class="navbar-brand"> SPORTS STORE </a>
    </div>
  </div>
  <div class="row">
    <div class="col-3 p-2">
      <button class="btn btn-block btn-outline-primary" (click)="changeCategory()">Home</button>
      <button
        class="btn btn-outline-primary btn-block"
        *ngFor="let cat of categories"
        [class.active]="cat === selectedCategory"
        (click)="changeCategory(cat)"
      >
        {{ cat }}
      </button>
    </div>
    <div class="col-3 bg-info p-2 text-white">{{ categories.length }} Categories</div>
    <div class="col-9 p-2">
      <div *ngFor="let product of products" class="card m-1 p-1 bg-light">
        <h4>
          {{ product.name }}
          <span class="badge badge-pill badge-primary float-right">{{
            product.price | currency: 'USD' : 'symbol' : '2.2-2'
          }}</span>
        </h4>
        <div class="card-text bg-white p-1">{{ product.description }}</div>
      </div>
      <div class="form-inline float-left mr-1">
        <select
          [value]="productsPerPage"
          (change)="changePageSizeFromEvent($event)"
          name=""
          id=""
          class="form-control"
        >
          <option [value]="3">3 per Page</option>
          <option [value]="4">4 per Page</option>
          <option [value]="6">6 per Page</option>
          <option [value]="8">8 per Page</option>
        </select>
      </div>
      <div class="btn-group float-right">
        <button
          class="btn btn-outline-primary"
          *counter="let page of pageCount"
          (click)="changePage(page)"
          [class.active]="page == selectedPage"
        >
          {{ page }}
        </button>
      </div>
    </div>
    <!-- <div class="col-9 bg-success p-2">{{ products.length }} Products</div> -->
  </div>
</div>
